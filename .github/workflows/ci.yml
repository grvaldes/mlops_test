name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Run Ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

  docker:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker compose build api

      - name: Start MLflow
        run: docker compose up -d mlflow

      - name: Wait for MLflow
        run: |
          for i in {1..30}; do
            if docker compose exec -T mlflow \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
            then
              echo "MLflow is healthy"
              exit 0
            fi

            echo "Waiting for MLflow..."
            sleep 2
          done

          echo "MLflow failed to become healthy"
          docker compose logs mlflow
          exit 1

      - name: Train and register model
        run: |
          docker compose run --rm \
            -e MLFLOW_TRACKING_URI=http://mlflow:5000 \
            api \
            uv run material-mlops

      - name: Start API
        run: docker compose up -d api

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if docker compose exec -T api \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:8050/health')"
            then
              echo "API is healthy"
              exit 0
            fi

            echo "Waiting for API..."
            sleep 2
          done

          echo "API failed to become healthy"
          docker compose logs
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=tag

      - name: Push Docker image
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read tag; do
            docker tag "$(docker compose images -q api)" "$tag"
            docker push "$tag"
          done

      - name: Stop services
        if: always()
        run: docker compose down -v